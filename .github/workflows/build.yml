name: Android and Windows
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
      - name: Test and build both clients
        run: ./gradlew.bat :app:desktopTest :app:assembleDebug :app:packageMsi
      - uses: actions/upload-artifact@v4
        with:
          name: Android-debug
          path: app/build/outputs/apk/debug/*.apk
      - uses: actions/upload-artifact@v4
        with:
          name: Windows-portable
          path: app/build/compose/binaries/main/app/Gproject/**
      - uses: actions/upload-artifact@v4
        with:
          name: Windows-installer
          path: app/build/compose/binaries/main/msi/*.msi
      - uses: actions/upload-artifact@v4
        with:
          name: UI-previews
          path: app/build/previews/*.png
